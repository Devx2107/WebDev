
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Page not found — the page you are looking for does not exist." />

  <title>404 — Page Not Found</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --text: #f4f6ff;
      --muted: #a1a9c2;
      --accent: #a78bfa;
      --accent-2: #67e8f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:
        radial-gradient(
          ellipse at 18% 18%,
          rgba(103, 232, 249, .12),
          transparent 38%
        ),
        radial-gradient(
          ellipse at 82% 78%,
          rgba(167, 139, 250, .16),
          transparent 42%
        ),
        var(--bg);
    }

    /* Background stars */

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";

      background-image:
        radial-gradient(
          2px 2px at 20% 30%,
          rgba(255,255,255,.7) 50%,
          transparent 100%
        ),
        radial-gradient(
          1px 1px at 70% 20%,
          rgba(255,255,255,.6) 50%,
          transparent 100%
        ),
        radial-gradient(
          1.5px 1.5px at 84% 55%,
          rgba(255,255,255,.5) 50%,
          transparent 100%
        ),
        radial-gradient(
          1px 1px at 35% 82%,
          rgba(255,255,255,.55) 50%,
          transparent 100%
        );

      opacity: .55;
    }

    .stars::before {
      transform: translate(12px, 18px);
      opacity: .35;
    }

    .stars::after {
      transform: translate(-18px, -12px);
      opacity: .25;
    }

    /* Main container */

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 680px);
      text-align: center;
      padding: clamp(28px, 6vw, 64px) 24px;
    }

    /* Orbital design */

    .orbit {
      position: relative;
      width: clamp(190px, 36vw, 260px);
      aspect-ratio: 1;
      margin: 0 auto 26px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(167,139,250,.13),
          rgba(103,232,249,.04) 55%,
          transparent 70%
        );

      box-shadow:
        0 0 80px rgba(167,139,250,.12),
        inset 0 0 45px rgba(103,232,249,.05);
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(167,139,250,.24);
      border-radius: 50%;
      inset: 13%;
      transform: rotate(-28deg) scaleY(.48);
    }

    .orbit::after {
      inset: 4%;
      border-color: rgba(103,232,249,.18);
      transform: rotate(42deg) scaleY(.42);
    }

    .planet {
      position: absolute;
      width: 12px;
      height: 12px;
      top: 17%;
      right: 17%;
      border-radius: 50%;

      background: var(--accent-2);
      box-shadow: 0 0 18px var(--accent-2);
    }

    /* 404 typography */

    .code {
      font-size: clamp(4.5rem, 16vw, 8rem);
      line-height: .9;
      font-weight: 850;
      letter-spacing: -.09em;

      background: linear-gradient(
        130deg,
        #fff 12%,
        var(--accent-2) 48%,
        var(--accent) 88%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter: drop-shadow(
        0 8px 28px rgba(167,139,250,.18)
      );
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-2);
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.65rem);
      letter-spacing: -.045em;
    }

    .message {
      max-width: 440px;
      margin: 14px auto 30px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Navigation buttons */

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 21px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;

      color: var(--text);
      font-size: .92rem;
      font-weight: 650;
      text-decoration: none;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 4px;
    }

    .primary {
      color: #0b1020;
      border-color: transparent;

      background: linear-gradient(
        110deg,
        var(--accent-2),
        #c4b5fd
      );

      box-shadow: 0 8px 28px rgba(103,232,249,.17);
    }

    .primary:hover {
      box-shadow: 0 12px 34px rgba(103,232,249,.27);
    }

    .secondary {
      background: rgba(255,255,255,.04);
    }

    .secondary:hover {
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.3);
    }

    .footnote {
      margin: 44px 0 0;
      color: #69728d;
      font-size: .78rem;
      letter-spacing: .03em;
    }

    /* Accessibility */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="stars" aria-hidden="true"></div>

  <main>

    <div class="orbit" aria-hidden="true">
      <span class="planet"></span>
      <div class="code">404</div>
    </div>

    <p class="eyebrow">Lost in space</p>

    <h1>Well, this is awkward.</h1>

    <p class="message">
      The page you're looking for seems to have drifted off
      into the unknown. It may have moved, or the link
      might be out of date.
    </p>

    <nav class="actions" aria-label="Page navigation">

      <a class="primary" href="/" aria-label="Go back to the homepage">
        <span aria-hidden="true">⌂</span>
        Back to home
      </a>

      <a class="secondary" href="javascript:history.back()">
        <span aria-hidden="true">←</span>
        Go back
      </a>

    </nav>

    <p class="footnote">
      ERROR 404 · PAGE NOT FOUND
    </p>

  </main>

</body>
</html>
