    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Block Example</title>
    <style>
        .container {
            /*To use flexbox, we need to set display property to flex*/
            display: flex;
            background-color: rgba(17, 181, 236, 0.801);
            width: 100%;
            margin : auto;
            flex-wrap: wrap;
            flex-direction: row-reverse;
            justify-content: space-between;
        }
        .div {
            height: 40px;
            width: 40px;
            margin: 10px;
            background-color: orange;
            line-height: 40px;
            text-align: center;
            
            /* DIV ko hum log block ke bajaye inline kar dete hai */
            /* display: inline; */
            
            /* To make inline elements but make sure height and width works on it, we use inline-block */
            display: inline-block;
        }
    </style>
</head>
