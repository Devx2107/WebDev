<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px solid black;
        }

        .div-2 {
            border: 1px solid red;
            position: absolute;
            top: 0px;
            left: 0px;
            right: 0px;
            background-color: yellow;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div>I am a div-1</div>
    <!-- by default it works in respect to viewport-->
    <div class="div-2">I am a div-2</div>
    <div>I am a div-3</div>
</body>
</html>
