<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- lists in html -->
     <!-- unordered list -->
      <!-- There are attricbutes that are associated with ul tags 
       type = ""
       options : circle , sqaure ,disc -->
    <ul type = "disc">
        Movies 
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <!-- ordered list  -->
     <!-- Attributes 
      1. Type 
      2. Start ( this is always a number )
       -->
    <ol>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ol>
</body>
</html>
